name: Build Joyn Österreich Fire TV APK

on:
  push:
    branches: [ main, claude/joyn-austria-firetv-apk-pztejx ]
    paths:
      - 'joyntv/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/joyntv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: |
          gradle :joyntv:assembleRelease
          cp joyntv/build/outputs/apk/release/joyntv-release.apk JoynAT-FireTV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoynAT-FireTV
          path: JoynAT-FireTV.apk
          retention-days: 30

      # Fixed download URL for the Fire TV "Downloader" app:
      # https://github.com/<owner>/<repo>/releases/download/joyntv-latest/JoynAT-FireTV.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: joyntv-latest
          name: Joyn Österreich – Fire TV APK
          body: Automatisch gebaute APK für den Amazon Fire TV Stick (öffnet www.joyn.at).
          prerelease: false
          make_latest: true
          files: JoynAT-FireTV.apk
