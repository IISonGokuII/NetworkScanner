name: Build Synapse APK

on:
  push:
    paths:
      - 'Synapse/**'
      - '.github/workflows/synapse.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Synapse

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests (alle Aufgaben-Generatoren & Statistik)
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-APK
          path: Synapse/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
